# กัน ML service บน Render แพลนฟรีไม่ให้หลับ
#
# แพลนฟรีจะพักบริการเมื่อไม่มีคนเรียกเกิน 15 นาที และตื่นใหม่ใช้เวลาราวหนึ่งนาที
# เวิร์กโฟลว์นี้ยิง /health ทุก 10 นาทีเพื่อให้ตื่นอยู่ตลอด (endpoint นี้เปิดไว้ ไม่ต้องใช้กุญแจ)
#
# ข้อแลกเปลี่ยนที่ต้องรู้ก่อนเปิดใช้
#   - Render แพลนฟรีให้เวลารันรวม 750 ชั่วโมงต่อเดือน การเปิดตลอดเวลาใช้ราว 730 ชั่วโมง
#     แปลว่าใช้เกือบหมดโควตา และจะเหลือที่ให้บริการฟรีตัวอื่นน้อยมาก
#   - GitHub จะปิดเวิร์กโฟลว์ตามเวลาอัตโนมัติ ถ้า repo ไม่มีความเคลื่อนไหวนาน 60 วัน
#   - เวลาที่ GitHub รันจริงอาจคลาดจากที่ตั้งไว้ได้หลายนาทีเมื่อระบบมีงานเยอะ
#
# ถ้าไม่ต้องการแล้วให้ลบไฟล์นี้ หรือปิดที่แท็บ Actions ของ repo
name: keep-ml-awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ยิง health ของ ML service
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 \
            https://banyatsap-market-ml.onrender.com/health)
          echo "health ตอบกลับ HTTP $code"
          test "$code" = "200"
